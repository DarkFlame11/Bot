<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Danielyan's 8D</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000; --card:#141218; --card-2:#1b1820; --line:rgba(255,255,255,0.09);
    --text:#f5f3f7; --dim:#8e8a99; --blue:#5fa7f0; --gold:#f2c94c; --silver:#e3e1e8;
    --g1:#8b5cf6; --g2:#e94f8a; --g3:#f5a623;
    --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:'Manrope', sans-serif; min-height:100vh;
    padding:calc(14px + var(--safe-top)) 16px calc(90px + var(--safe-bottom));
    -webkit-tap-highlight-color:transparent;
  }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;} }
  a{color:inherit;} button{font-family:inherit;}
  .grad-text{background:linear-gradient(100deg, var(--g1), var(--g2) 55%, var(--g3)); -webkit-background-clip:text; background-clip:text; color:transparent;}

  .head{display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:18px;}
  .logo-badge{width:96px; height:auto; margin-bottom:10px; display:block; object-fit:contain; border-radius: 12px;}
  .brand-name{font-family:'Playfair Display', serif; font-style:italic; font-weight:900; font-size:22px; line-height:1.1;}
  .sub-count{margin-top:5px; color:var(--dim); font-size:12.5px; font-weight:600;}
  .sub-count b{color:var(--text);}

  .search-row{display:flex; gap:8px; margin-bottom:14px;}
  #query{flex:1; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; color:var(--text); font-size:15px; outline:none;}
  #query::placeholder{color:var(--dim);}
  #query:focus{border-color:var(--blue);}
  #searchBtn{background:var(--blue); border:none; border-radius:12px; padding:0 18px; color:#0a0a0a; font-weight:800; font-size:14px; cursor:pointer;}
  #searchBtn:active{transform:scale(0.96);}

  .tabs{display:flex; gap:6px; margin-bottom:16px; overflow-x:auto; padding-bottom:2px;}
  .tab-btn{
    flex-shrink:0; background:var(--card); border:1px solid var(--line); color:var(--dim);
    border-radius:999px; padding:8px 14px; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .tab-btn.active{color:var(--text); border-color:var(--blue); background:var(--card-2);}

  .feed-label{font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--dim); font-weight:700; margin-bottom:10px;}

  .post-card{background:var(--card); border-radius:14px; padding:12px 14px; margin-bottom:9px; border:1px solid var(--line);}
  .track-row{display:flex; align-items:center; gap:10px;}
  .play-circle{
    width:36px; height:36px; border-radius:50%; background:var(--card-2); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer; padding:0;
  }
  .play-circle svg{width:12px; height:12px; fill:var(--silver);}
  .play-circle:active{background:var(--blue);}
  .track-meta{flex:1; min-width:0;}
  .track-meta .name{color:var(--blue); font-weight:700; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .track-meta .handle{font-family:'Playfair Display', serif; font-style:italic; font-size:14px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .fav-btn{background:none; border:none; font-size:18px; cursor:pointer; flex-shrink:0; padding:4px;}
  .plays{font-size:11px; color:var(--dim); flex-shrink:0;}

  .empty, .loading{color:var(--dim); font-size:13.5px; padding:20px 4px; text-align:center;}
  .gate{
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; text-align:center;
    font-size:13.5px; color:var(--dim); line-height:1.6;
  }

  .bottom-bar{
    position:fixed; left:0; right:0; bottom:0; padding:10px 16px calc(10px + var(--safe-bottom));
    background:rgba(0,0,0,0.85); backdrop-filter:blur(14px); border-top:1px solid var(--line);
    display:grid; grid-template-columns:repeat(4,1fr); gap:8px;
  }
  .bottom-bar a{
    display:flex; flex-direction:column; align-items:center; gap:4px; text-decoration:none; color:var(--dim); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
  }
  .bottom-bar a svg{width:18px; height:18px; stroke:var(--blue);}

  .pl-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:9px;
  }
  .pl-row .pl-name{font-family:'Playfair Display', serif; font-style:italic; font-weight:700; font-size:15px;}
  .pl-row .pl-count{font-size:11.5px; color:var(--dim); margin-top:2px;}
  .pl-row .pl-actions{display:flex; gap:6px; flex-shrink:0;}
  .pl-row button{background:var(--card-2); border:1px solid var(--line); border-radius:10px; color:var(--text); font-size:13px; padding:8px 10px; cursor:pointer;}
  .pl-row .pl-del{color:#e94f8a;}

  .create-pl{
    width:100%; background:var(--card-2); border:1px dashed var(--line); border-radius:14px;
    padding:14px; color:var(--blue); font-weight:700; font-size:13.5px; cursor:pointer; margin-bottom:10px;
  }

  .back-row{display:flex; align-items:center; gap:8px; margin-bottom:12px; cursor:pointer; color:var(--blue); font-size:13.5px; font-weight:700;}

  .add-btn{background:none; border:none; color:var(--dim); font-size:18px; cursor:pointer; flex-shrink:0; padding:4px;}

  .sheet-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; align-items:flex-end; z-index:100;
  }
  .sheet-overlay.show{display:flex;}
  .sheet{
    background:var(--card); width:100%; border-radius:20px 20px 0 0; padding:18px 16px calc(18px + var(--safe-bottom));
    max-height:60vh; overflow-y:auto;
  }
  .sheet h4{font-family:'Playfair Display', serif; font-style:italic; font-size:16px; margin-bottom:12px;}
  .sheet .sheet-item{
    padding:12px; border-radius:12px; background:var(--card-2); margin-bottom:8px; cursor:pointer; font-size:14px;
  }
  .sheet .sheet-empty{color:var(--dim); font-size:13px; padding:8px 0;}

  /* MINI PLAYER */
  .player-bar{
    position:fixed; left:0; right:0; bottom:64px; padding:10px 14px;
    background:linear-gradient(180deg, rgba(20,18,24,0.6), rgba(0,0,0,0.95)), var(--card);
    border-top:1px solid var(--line); display:none; align-items:center; gap:10px; z-index:60;
  }
  .player-bar.show{display:flex;}
  .player-toggle{
    width:38px; height:38px; border-radius:50%; background:var(--blue); border:none; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .player-toggle svg{width:14px; height:14px; fill:#0a0a0a;}
  .player-info{flex:1; min-width:0;}
  .player-info .p-artist{color:var(--blue); font-weight:700; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .player-info .p-title{font-family:'Playfair Display', serif; font-style:italic; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .player-progress{
    height:3px; background:var(--card-2); border-radius:2px; margin-top:6px; position:relative; cursor:pointer;
  }
  .player-progress .fill{
    height:100%; border-radius:2px; background:linear-gradient(90deg, var(--g1), var(--g2), var(--g3)); width:0%;
  }
  .player-close{background:none; border:none; color:var(--dim); font-size:16px; cursor:pointer; flex-shrink:0; padding:4px;}
  .play-circle.playing{background:var(--blue);}
  .play-circle.playing svg{fill:#0a0a0a;}
  body.player-open{ padding-bottom:calc(148px + var(--safe-bottom)); }
  .player-bar{cursor:pointer;}

  /* FULLSCREEN NOW PLAYING */
  .now-playing{
    position:fixed; inset:0; background:#000; z-index:200; display:none;
    flex-direction:column; padding:calc(18px + var(--safe-top)) 24px calc(28px + var(--safe-bottom));
  }
  .now-playing.show{display:flex;}
  .np-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .np-back{background:none; border:none; color:var(--dim); font-size:22px; cursor:pointer; padding:6px;}
  .np-eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:0.15em; color:var(--gold); font-weight:700;}
.np-art{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:0;
  border-radius:24px;
 
}
.np-art img{
  width:min(70vw, 280px);
  border-radius:100px;
  height:min(70vw, 280px);
  object-fit:contain;
  filter:drop-shadow(0 20px 60px rgba(139,92,246,0.25));
  
}
  .np-meta{text-align:center; margin-top:8px;}
  .np-artist{color:var(--blue); font-weight:700; font-size:15px;}
  .np-title{font-family:'Playfair Display', serif; font-style:italic; font-weight:700; font-size:24px; margin-top:6px; line-height:1.2;}
  .np-progress-row{display:flex; align-items:center; gap:10px; margin-top:28px;}
  .np-time{font-size:11px; color:var(--dim); width:34px; flex-shrink:0;}
  .np-time.end{text-align:right;}
  .np-progress{flex:1; height:4px; background:var(--card-2); border-radius:3px; position:relative; cursor:pointer;}
  .np-progress .fill{height:100%; border-radius:3px; background:linear-gradient(90deg, var(--g1), var(--g2), var(--g3)); width:0%;}
  .np-controls{display:flex; align-items:center; justify-content:center; gap:28px; margin-top:30px;}
  .np-play{
    width:72px; height:72px; border-radius:50%; background:var(--blue); border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .np-play svg{width:26px; height:26px; fill:#0a0a0a;}
  .np-side{
    width:48px; height:48px; border-radius:50%; background:var(--card); border:1px solid var(--line); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .np-side svg{width:18px; height:18px; fill:var(--silver);}
  .np-extra{display:flex; justify-content:center; gap:20px; margin-top:26px;}
  .np-extra button{background:none; border:none; color:var(--dim); font-size:20px; cursor:pointer;}
</style>
</head>

<script>
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  let currentQueue = [];
  const listEl = document.getElementById('list');
  const feedLabel = document.getElementById('feedLabel');
  const queryInput = document.getElementById('query');

  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.setHeaderColor) { try { tg.setHeaderColor('secondary_bg_color'); } catch(e) {} }
  }

  function escapeHtml(s){
    return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function apiGet(path){
    const res = await fetch(path, { headers: { 'X-Telegram-Init-Data': tg ? tg.initData : '' } });
    if (res.status === 401) throw new Error('need_telegram');
    if (res.status === 403) throw new Error('need_subscription');
    if (!res.ok) throw new Error('api_error');
    return res.json();
  }

  function renderTracks(items, opts){
    opts = opts || {};
    if (!items || !items.length){
      listEl.innerHTML = '<p class="empty">Пусто</p>';
      currentQueue = [];
      return;
    }
    currentQueue = items.slice();
    listEl.innerHTML = '';
    if (opts.backTo){
      const back = document.createElement('div');
      back.className = 'back-row';
      back.innerHTML = '‹ Все плейлисты';
      back.addEventListener('click', () => loadTab('playlists'));
      listEl.appendChild(back);
    }
    items.forEach(t => {
      const card = document.createElement('div');
      card.className = 'post-card';
      const removeBtn = opts.playlistId
        ? `<button class="add-btn pl-remove" data-id="${t.id}" data-pl="${opts.playlistId}" aria-label="Убрать">🗑</button>`
        : `<button class="add-btn pl-open" data-id="${t.id}" aria-label="В плейлист">➕</button>`;
      card.innerHTML = `
        <div class="track-row">
          <button class="play-circle" data-id="${t.id}" data-artist="${escapeHtml(t.artist || 'Unknown')}" data-title="${escapeHtml(t.title || '')}" aria-label="Слушать">
            <svg viewBox="0 0 24 24"><path d="M6 4 L20 12 L6 20 Z"/></svg>
          </button>
          <div class="track-meta">
            <div class="name">${escapeHtml(t.artist || 'Unknown')}</div>
            <div class="handle">${escapeHtml(t.title || '')}</div>
          </div>
          ${t.plays !== undefined ? `<div class="plays">${t.plays} 🎧</div>` : ''}
          <button class="fav-btn" data-id="${t.id}" aria-label="В избранное">🤍</button>
          ${removeBtn}
        </div>`;
      listEl.appendChild(card);
    });
  }

  function renderPlaylists(data){
    listEl.innerHTML = '';
    const createBtn = document.createElement('button');
    createBtn.className = 'create-pl';
    createBtn.textContent = data.items.length < data.max
      ? `➕ Создать плейлист (${data.items.length}/${data.max})`
      : `⛔ Лимит ${data.max} плейлистов достигнут`;
    createBtn.disabled = data.items.length >= data.max;
    createBtn.addEventListener('click', () => {
      const name = window.prompt('Название плейлиста (до 50 символов):', '');
      if (name && name.trim() && tg && tg.sendData) {
        tg.sendData(JSON.stringify({ action: 'playlist_create', name: name.trim().slice(0, 50) }));
      }
    });
    listEl.appendChild(createBtn);

    if (!data.items.length){
      listEl.innerHTML += '<p class="empty">У тебя пока нет плейлистов</p>';
      return;
    }
    data.items.forEach(p => {
      const row = document.createElement('div');
      row.className = 'pl-row';
      row.innerHTML = `
        <div>
          <div class="pl-name">${escapeHtml(p.name)}</div>
          <div class="pl-count">${p.count} тр.</div>
        </div>
        <div class="pl-actions">
          <button class="pl-open-playlist" data-id="${p.id}">Открыть</button>
          <button class="pl-del" data-id="${p.id}">🗑</button>
        </div>`;
      listEl.appendChild(row);
    });
  }

  async function openPlaylist(pid){
    listEl.innerHTML = '<div class="loading">Загрузка…</div>';
    try {
      const data = await apiGet('/api/playlists/' + pid);
      feedLabel.textContent = data.name;
      renderTracks(data.items, { playlistId: pid, backTo: true });
    } catch (e) {
      showGate(e.message);
    }
  }

  let sheetTrackId = null;
  const sheetOverlay = document.getElementById('sheetOverlay');
  const sheetList = document.getElementById('sheetList');

  async function openAddToPlaylistSheet(trackId){
    sheetTrackId = trackId;
    sheetList.innerHTML = '<div class="sheet-empty">Загрузка…</div>';
    sheetOverlay.classList.add('show');
    try {
      const data = await apiGet('/api/playlists');
      if (!data.items.length){
        sheetList.innerHTML = '<div class="sheet-empty">Сначала создай плейлист на вкладке «Плейлисты»</div>';
        return;
      }
      sheetList.innerHTML = '';
      data.items.forEach(p => {
        const item = document.createElement('div');
        item.className = 'sheet-item';
        item.textContent = `📋 ${p.name} (${p.count})`;
        item.addEventListener('click', () => {
          if (tg && tg.sendData) {
            tg.sendData(JSON.stringify({ action: 'playlist_add', playlist_id: p.id, track_id: sheetTrackId }));
          }
          sheetOverlay.classList.remove('show');
        });
        sheetList.appendChild(item);
      });
    } catch (e) {
      sheetList.innerHTML = '<div class="sheet-empty">Не удалось загрузить плейлисты</div>';
    }
  }

  sheetOverlay.addEventListener('click', (e) => {
    if (e.target === sheetOverlay) sheetOverlay.classList.remove('show');
  });

  function showGate(kind){
    if (kind === 'need_telegram') {
      listEl.innerHTML = '<div class="gate">Открой это внутри Telegram — так бот сможет тебя узнать.</div>';
    } else if (kind === 'need_subscription') {
      listEl.innerHTML = '<div class="gate">Доступ только для подписчиков канала. Подпишись и открой мини-приложение заново.</div>';
    } else {
      listEl.innerHTML = '<div class="gate">Не удалось загрузить. Попробуй ещё раз.</div>';
    }
  }

  async function loadTab(tab){
    document.querySelectorAll('.tab-btn').forEach(x => x.classList.toggle('active', x.dataset.tab === tab));
    listEl.innerHTML = '<div class="loading">Загрузка…</div>';
    const labels = { top: 'Топ треков', new: 'Новинки', fav: 'Твоё избранное', playlists: 'Твои плейлисты' };
    feedLabel.textContent = labels[tab] || '';
    try {
      if (tab === 'playlists') {
        const data = await apiGet('/api/playlists');
        renderPlaylists(data);
        return;
      }
      const data = await apiGet('/api/' + (tab === 'fav' ? 'favorites' : tab));
      renderTracks(data.items);
    } catch (e) {
      showGate(e.message);
    }
  }

  document.querySelectorAll('.tab-btn').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      loadTab(b.dataset.tab);
    });
  });

  async function doSearch(){
    const q = queryInput.value.trim();
    if (!q) return;
    feedLabel.textContent = `Результаты: «${q}»`;
    listEl.innerHTML = '<div class="loading">Ищу…</div>';
    document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
    try {
      const data = await apiGet('/api/search?q=' + encodeURIComponent(q));
      renderTracks(data.items);
    } catch (e) {
      showGate(e.message);
    }
  }
  document.getElementById('searchBtn').addEventListener('click', doSearch);
  queryInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

  // ---------- ПЛЕЕР ----------
  const audioEl = document.getElementById('audioEl');
  const playerBar = document.getElementById('playerBar');
  const playerToggle = document.getElementById('playerToggle');
  const playerIcon = document.getElementById('playerIcon');
  const playerFill = document.getElementById('playerFill');
  const playerProgress = document.getElementById('playerProgress');
  const pArtist = document.getElementById('pArtist');
  const pTitle = document.getElementById('pTitle');
  const playerClose = document.getElementById('playerClose');

  const nowPlaying = document.getElementById('nowPlaying');
  const npBack = document.getElementById('npBack');
  const npArt = document.getElementById('npArt');
  const npArtist = document.getElementById('npArtist');
  const npTitle = document.getElementById('npTitle');
  const npProgress = document.getElementById('npProgress');
  const npFill = document.getElementById('npFill');
  const npTimeCur = document.getElementById('npTimeCur');
  const npTimeEnd = document.getElementById('npTimeEnd');
  const npPlay = document.getElementById('npPlay');
  const npPlayIcon = document.getElementById('npPlayIcon');
  const npPrev = document.getElementById('npPrev');
  const npNext = document.getElementById('npNext');
  const npFav = document.getElementById('npFav');
  const npAdd = document.getElementById('npAdd');

  let currentTrackId = null;
  let currentBtn = null;
  let currentIndex = -1;
  let isRandomSource = false;

  const ICON_PLAY = '<path d="M6 4 L20 12 L6 20 Z"/>';
  const ICON_PAUSE = '<path d="M6 4 H10 V20 H6 Z"/><path d="M14 4 H18 V20 H14 Z"/>';

  function fmtTime(sec){
    if (!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function setPlayingUI(playing){
    playerIcon.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
    npPlayIcon.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
    if (currentBtn) currentBtn.classList.toggle('playing', playing);
  }

  function showStreamError(status, text){
    let msg = 'Не удалось загрузить трек.';
    if (status === 401) msg = 'Открой это внутри Telegram — так бот сможет тебя узнать.';
    else if (status === 403) msg = 'Доступ только для подписчиков канала.';
    else if (status === 404) msg = 'Трек не найден в базе.';
    else if (status === 502) msg = 'Telegram не отдал файл. Возможно, трек слишком большой (лимит скачивания через бота — 20 МБ) или файл устарел.';
    else if (status === 0) msg = 'Нет соединения с сервером.';
    playerBar.classList.remove('show');
    nowPlaying.classList.remove('show');
    document.body.classList.remove('player-open');
    listEl.insertAdjacentHTML('afterbegin', `<div class="gate">${msg}${text ? ' <br><span style="opacity:.6;font-size:11px">(' + escapeHtml(text.slice(0,120)) + ')</span>' : ''}</div>`);
  }

  const npArtSrc = document.querySelector('.logo-badge') ? document.querySelector('.logo-badge').src : '';

  /** Основная функция запуска трека. index — позиция в currentQueue (для next/prev), или -1 для одиночных треков (случайный). */
  async function loadAndPlay(id, artist, title, btn, index){
    if (currentTrackId === id) {
      if (audioEl.paused) { audioEl.play(); } else { audioEl.pause(); }
      nowPlaying.classList.add('show');
      return;
    }

    const initData = tg ? tg.initData : '';
    const url = '/api/stream/' + id + '?init_data=' + encodeURIComponent(initData);

    if (currentBtn) currentBtn.classList.remove('playing');
    currentTrackId = id;
    currentBtn = btn;
    currentIndex = (typeof index === 'number') ? index : -1;

    pArtist.textContent = artist;
    pTitle.textContent = title;
    npArtist.textContent = artist;
    npTitle.textContent = title;
    npArt.src = npArtSrc;

    playerBar.classList.add('show');
    nowPlaying.classList.add('show');
    document.body.classList.add('player-open');

    // Играем сразу, без предварительной проверки — так быстрее.
    // Если что-то не так, сработает событие 'error' на <audio>,
    // и уже тогда сделаем один диагностический запрос, чтобы объяснить причину.
    audioEl.src = url;
    audioEl.play().catch(() => {});
  }

  function playFromQueue(id, artist, title, btn){
    isRandomSource = false;
    const idx = currentQueue.findIndex(t => t.id === id);
    loadAndPlay(id, artist, title, btn, idx);
  }

  async function playRandom(){
    isRandomSource = true;
    try {
      const data = await apiGet('/api/random');
      if (data.item) loadAndPlay(data.item.id, data.item.artist, data.item.title, null, -1);
    } catch (e) {}
  }

  async function goNext(){
    if (isRandomSource) { playRandom(); return; }
    if (!currentQueue.length) return;
    const idx = (currentIndex + 1) % currentQueue.length;
    const t = currentQueue[idx];
    loadAndPlay(t.id, t.artist, t.title, null, idx);
  }

  function goPrev(){
    if (isRandomSource || !currentQueue.length) return;
    const idx = (currentIndex - 1 + currentQueue.length) % currentQueue.length;
    const t = currentQueue[idx];
    loadAndPlay(t.id, t.artist, t.title, null, idx);
  }

  audioEl.addEventListener('play', () => setPlayingUI(true));
  audioEl.addEventListener('pause', () => setPlayingUI(false));
  audioEl.addEventListener('ended', () => { setPlayingUI(false); goNext(); });
  audioEl.addEventListener('timeupdate', () => {
    if (audioEl.duration) {
      const pct = (audioEl.currentTime / audioEl.duration * 100) + '%';
      playerFill.style.width = pct;
      npFill.style.width = pct;
      npTimeCur.textContent = fmtTime(audioEl.currentTime);
      npTimeEnd.textContent = fmtTime(audioEl.duration);
    }
  });
  audioEl.addEventListener('error', async () => {
    // Реальный сбой — теперь делаем диагностический запрос, чтобы понять причину
    const failedSrc = audioEl.src;
    if (!failedSrc) return;
    try {
      const check = await fetch(failedSrc, { headers: { 'Range': 'bytes=0-1' } });
      if (!check.ok && check.status !== 206) {
        const text = await check.text().catch(() => '');
        showStreamError(check.status, text);
        return;
      }
    } catch (e) {
      showStreamError(0, '');
      return;
    }
    showStreamError(-1, 'audio_element_error');
  });

  playerToggle.addEventListener('click', () => {
    if (audioEl.paused) audioEl.play(); else audioEl.pause();
  });
  npPlay.addEventListener('click', () => {
    if (audioEl.paused) audioEl.play(); else audioEl.pause();
  });

  function seekFrom(el){
    if (!audioEl.duration) return;
    return (e) => {
      const rect = el.getBoundingClientRect();
      const ratio = (e.clientX - rect.left) / rect.width;
      audioEl.currentTime = Math.max(0, Math.min(1, ratio)) * audioEl.duration;
    };
  }
  playerProgress.addEventListener('click', (e) => { const f = seekFrom(playerProgress); if (f) f(e); });
  npProgress.addEventListener('click', (e) => { const f = seekFrom(npProgress); if (f) f(e); });

  npNext.addEventListener('click', goNext);
  npPrev.addEventListener('click', goPrev);

  // Тап по мини-плееру снизу — снова открыть полноэкранную страницу
  playerBar.addEventListener('click', (e) => {
    if (e.target.closest('.player-close') || e.target.closest('.player-toggle')) return;
    nowPlaying.classList.add('show');
  });

  npBack.addEventListener('click', () => {
    nowPlaying.classList.remove('show'); // трек продолжает играть, просто сворачиваем
  });

  npFav.addEventListener('click', () => {
    if (currentTrackId && tg && tg.sendData) {
      npFav.textContent = '❤️';
      tg.sendData(JSON.stringify({ action: 'fav', track_id: currentTrackId }));
    }
  });
  npAdd.addEventListener('click', () => {
    if (currentTrackId) openAddToPlaylistSheet(currentTrackId);
  });

  playerClose.addEventListener('click', (e) => {
    e.stopPropagation();
    audioEl.pause();
    audioEl.src = '';
    currentTrackId = null;
    currentIndex = -1;
    if (currentBtn) currentBtn.classList.remove('playing');
    currentBtn = null;
    playerBar.classList.remove('show');
    nowPlaying.classList.remove('show');
    document.body.classList.remove('player-open');
  });

  listEl.addEventListener('click', (e) => {
    const play = e.target.closest('.play-circle');
    const fav = e.target.closest('.fav-btn');
    const plOpenTrackSheet = e.target.closest('.pl-open');
    const plRemove = e.target.closest('.pl-remove');
    const plOpen = e.target.closest('.pl-open-playlist');
    const plDel = e.target.closest('.pl-del');

    if (play) {
      playFromQueue(Number(play.dataset.id), play.dataset.artist, play.dataset.title, play);
    }
    if (fav && tg && tg.sendData) {
      fav.textContent = '❤️';
      tg.sendData(JSON.stringify({ action: 'fav', track_id: Number(fav.dataset.id) }));
    }
    if (plOpenTrackSheet) {
      openAddToPlaylistSheet(Number(plOpenTrackSheet.dataset.id));
    }
    if (plRemove && tg && tg.sendData) {
      tg.sendData(JSON.stringify({ action: 'playlist_remove', playlist_id: Number(plRemove.dataset.pl), track_id: Number(plRemove.dataset.id) }));
      plRemove.closest('.post-card').remove();
    }
    if (plOpen) {
      openPlaylist(Number(plOpen.dataset.id));
    }
    if (plDel && tg && tg.sendData) {
      if (confirm('Удалить этот плейлист?')) {
        tg.sendData(JSON.stringify({ action: 'playlist_delete', playlist_id: Number(plDel.dataset.id) }));
        plDel.closest('.pl-row').remove();
      }
    }
  });

  if (tg) {
    tg.MainButton.setText('🎲 Случайный трек');
    tg.MainButton.show();
    tg.MainButton.onClick(playRandom);
  }

  document.getElementById('shareLink').addEventListener('click', (e) => {
    e.preventDefault();
    if (tg && tg.openTelegramLink) {
      tg.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent('https://t.me/dan1elyans') + '&text=' + encodeURIComponent("Danielyan's 8D 🎧 — 8D-музыка в наушниках"));
    }
  });

  loadTab('top');
</script>

</body>
</html>
